<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaFinder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">🎬</div>
        <div class="brand-text">
          <h1>MediaFinder</h1>
          <p class="subtitle" data-i18n="媒体文件快速查找工具">媒体文件快速查找工具</p>
        </div>
      </div>
      <div class="topbar-right">
        <span id="monitorBadge" class="badge badge-off">自动刷新关闭</span>
        <button id="langBtn" class="btn btn-ghost btn-icon" title="切换语言 / Language"></button>
        <button id="themeBtn" class="btn btn-ghost btn-icon" title="切换明暗模式">🌙</button>
        <button id="refreshBtn" class="btn btn-ghost btn-icon" title="刷新状态">↻</button>
        <button id="quitBtn" class="btn btn-ghost" data-i18n="关闭服务器">关闭服务器</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <section class="card">
          <div class="card-head"><span data-i18n="索引状态">📊 索引状态</span></div>
          <div class="stat-row">
            <div class="stat">
              <div class="stat-value" id="indexCount">–</div>
              <div class="stat-label" data-i18n="文件数">文件数</div>
            </div>
            <div class="stat">
              <div class="stat-value stat-value-sm" id="indexTime">–</div>
              <div class="stat-label" data-i18n="索引更新">索引更新</div>
            </div>
          </div>
          <button id="scanBtn" class="btn btn-primary btn-block">
            <span class="btn-label" data-i18n="重新扫描">⟳ 重新扫描</span>
          </button>
          <div class="hint" id="scanHint"></div>
        </section>

        <section class="card foldable" id="monitorCard">
          <div class="card-head">
            <span class="fold-toggle" data-i18n-title="折叠/展开" title="折叠/展开">▾</span>
            <span id="monitorCardTitle">⚡ 实时索引</span>
          </div>
          <div class="card-collapsible">
            <div class="toggle-row">
              <span id="monitorText">自动刷新已关闭</span>
              <label class="switch">
                <input type="checkbox" id="monitorToggle">
                <span class="slider"></span>
              </label>
            </div>
            <p class="hint" id="monitorHint">开启后每几秒自动检查监控目录中的新文件并收录（低功耗）</p>
          </div>
        </section>

        <section class="card foldable" id="logCard">
          <div class="card-head">
            <span class="fold-toggle" data-i18n-title="折叠/展开" title="折叠/展开">▾</span>
            <span data-i18n="活动日志">📜 活动日志</span>
            <button id="logManageBtn" class="btn btn-sm btn-primary" data-i18n="日志管理">⚙ 日志管理</button>
          </div>
          <div class="card-collapsible">
            <div class="log-tools">
              <span class="log-date-group">
                <button id="logPrevBtn" class="icon-btn-sm" data-i18n-title="前一天" title="前一天">◀</button>
                <span id="logDate" class="log-date" data-i18n-title="回到今天" title="回到今天">今天</span>
                <button id="logNextBtn" class="icon-btn-sm" data-i18n-title="后一天" title="后一天">▶</button>
              </span>
              <select id="logFilter" class="log-filter" data-i18n-title="按类型筛选" title="按类型筛选">
                <option value="" data-i18n="全部">全部</option>
                <option value="added" data-i18n="新增">新增</option>
                <option value="moved" data-i18n="移动">移动</option>
                <option value="gone" data-i18n="消失">消失</option>
              </select>
            </div>
            <ul class="log-list" id="logList"></ul>
            <p class="hint" id="logHint">检测新增、移动与消失的媒体文件（可能移入回收站或未监控目录）</p>
          </div>
        </section>

        <section class="card foldable" id="pathsCard">
          <div class="card-head">
            <span class="fold-toggle" data-i18n-title="折叠/展开" title="折叠/展开">▾</span>
            <span data-i18n="监控目录">📁 监控目录</span>
            <button id="addPathBtn" class="btn btn-sm btn-primary" data-i18n="添加目录">＋ 添加目录</button>
          </div>
          <div class="card-collapsible">
            <div id="privacyNote"></div>
            <ul class="path-list" id="pathList"></ul>
            <p class="hint" data-i18n="不知道路径也没关系，点「添加目录」可智能搜索或浏览查找">不知道路径也没关系，点「添加目录」可智能搜索或浏览查找</p>
          </div>
        </section>
      </aside>

      <section class="main">
        <div class="card search-card">
          <div class="search-row">
            <div class="search-input-wrap">
              <input id="kwInput" type="text" data-i18n-placeholder="输入关键字搜索…" placeholder="输入关键字搜索…" autocomplete="off" spellcheck="false">
              <button type="button" class="search-clear" id="kwClear" data-i18n-title="清空" title="清空" aria-label="Clear" hidden>✕</button>
            </div>
            <select id="typeSelect">
              <option value="" data-i18n="全部类型">全部类型</option>
              <option value="video" data-i18n="视频">🎥 视频</option>
              <option value="image" data-i18n="图片">🖼️ 图片</option>
              <option value="audio" data-i18n="音频">🎵 音频</option>
            </select>
            <select id="sinceSelect">
              <option value="" data-i18n="不限时间">不限时间</option>
              <option value="24h" data-i18n="最近 24 小时">最近 24 小时</option>
              <option value="7d" data-i18n="最近 7 天">最近 7 天</option>
              <option value="30d" data-i18n="最近 30 天">最近 30 天</option>
              <option value="90d" data-i18n="最近 90 天">最近 90 天</option>
            </select>
            <button id="searchBtn" class="btn btn-primary" data-i18n="搜索">搜索</button>
          </div>
          <div class="search-toolbar">
            <div class="search-meta" id="searchMeta"></div>
            <div class="group-actions" id="groupActions" style="display:none">
              <button id="expandAllBtn" class="btn btn-sm" data-i18n="全部展开">全部展开</button>
              <button id="collapseAllBtn" class="btn btn-sm" data-i18n="全部折叠">全部折叠</button>
            </div>
          </div>
        </div>

        <div class="results" id="results">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">🔍</div>
            <p data-i18n="输入关键字，开始查找你的媒体文件">输入关键字，开始查找你的媒体文件</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-mask" id="addModal" style="display:none">
    <div class="modal">
      <div class="modal-head">
        <h3 data-i18n="添加搜索目录">➕ 添加搜索目录</h3>
        <button class="btn btn-ghost btn-icon" id="modalClose" data-i18n-title="关闭" title="关闭">✕</button>
      </div>
      <div class="modal-body">
        <div class="add-section">
          <label class="add-label"><span data-i18n="智能搜索">智能搜索</span> <span class="hint-inline" data-i18n="不知道路径？输入游戏/软件名帮你找">不知道路径？输入游戏/软件名帮你找</span></label>
          <div class="add-row">
            <input id="suggestKw" data-i18n-placeholder="例如：无畏契约 / Valorant / 原神" placeholder="例如：无畏契约 / Valorant / 原神" autocomplete="off">
            <button class="btn btn-primary btn-sm" id="suggestBtn" data-i18n="搜索">搜索</button>
          </div>
          <div class="suggest-list" id="suggestList"></div>
        </div>
        <div class="add-divider"><span data-i18n="或手动浏览文件夹">或手动浏览文件夹</span></div>
        <div class="add-section">
          <div class="browse-path" id="browsePath" data-i18n="请选择位置…">请选择位置…</div>
          <div class="browse-actions">
            <button class="btn btn-sm" id="browseUp" data-i18n="上一级" disabled>⬆ 上一级</button>
            <button class="btn btn-sm btn-primary" id="browseAdd" data-i18n="添加此目录" disabled>＋ 添加此目录</button>
          </div>
          <div class="browse-list" id="browseList"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="logModal" style="display:none">
    <div class="modal">
      <div class="modal-head">
        <h3 data-i18n="日志管理">📜 日志管理</h3>
        <button class="btn btn-ghost btn-icon" id="logModalClose" data-i18n-title="关闭" title="关闭">✕</button>
      </div>
      <div class="modal-body">
        <p class="log-manage-hint" id="logManageHint"></p>
        <div class="log-manage-list" id="logManageList"></div>
        <div class="log-manage-actions">
          <button id="logDelAllBtn" class="btn btn-sm btn-danger" data-i18n="删除全部日志">🗑 删除全部日志</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
